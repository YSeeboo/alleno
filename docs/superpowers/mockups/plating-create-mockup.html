<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新建电镀单 · 样式预览</title>
  <style>
    :root { --ink:#1A1D21; --green:#1E7A5A; --soft:#E6F2EC; --muted:#8B9096; --line:#ECEDEF; --sub:#F6F7F8; --danger:#D94950; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#fff; font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible { outline:2px solid var(--green); outline-offset:3px; }
    svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
    .sidebar { width:216px; position:fixed; inset:0 auto 0 0; border-right:1px solid var(--line); background:#FAFBFB; padding:25px 14px 80px; overflow:auto; }
    .brand { padding:0 14px 26px; display:flex; align-items:center; gap:10px; font-size:16px; letter-spacing:2px; font-weight:750; }
    .brand-mark { width:30px; height:30px; display:grid; place-items:center; border-radius:8px; color:#fff; background:var(--green); font-size:14px; letter-spacing:-1px; }
    .nav-group { margin:20px 14px 8px; color:#9AA0A6; font-size:10px; letter-spacing:1.8px; }
    .nav-item { padding:10px 14px; display:flex; gap:12px; align-items:center; border-radius:7px; color:#626970; margin:3px 0; }
    .nav-item.active { background:var(--soft); color:var(--green); font-weight:600; }
    .nav-item.child { padding-left:42px; font-size:12px; }
    .user { position:absolute; bottom:22px; left:26px; display:flex; align-items:center; gap:9px; color:#757C83; font-size:12px; }
    .avatar { width:29px; height:29px; display:grid; place-items:center; background:#E9ECEB; border-radius:50%; color:#62766D; }
    main { margin-left:216px; padding:30px 32px 0; min-height:100vh; display:flex; flex-direction:column; }
    .crumbs { color:var(--muted); font-size:12px; display:flex; gap:9px; align-items:center; margin-bottom:18px; }
    .crumbs span:last-child { color:#535A60; }
    .head { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .title { display:flex; align-items:center; gap:12px; }
    h1 { margin:0; font-size:25px; font-weight:700; letter-spacing:-.6px; }
    .badge { padding:3px 9px; border-radius:20px; font-size:11px; color:var(--green); background:var(--soft); white-space:nowrap; }
    .intro { color:var(--muted); margin:7px 0 27px; font-size:12px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; padding:7px 12px; border:1px solid var(--line); border-radius:7px; color:#4C535A; background:#fff; transition:background .15s,border-color .15s; }
    .btn:hover { background:var(--sub); border-color:#CAD0D4; }
    .btn.green { color:var(--green); background:var(--soft); border-color:#C5E0D3; }
    .btn.green:hover { background:#D6EBE0; }
    .btn.primary { background:var(--green); color:#fff; border-color:var(--green); padding:10px 20px; font-weight:600; }
    .btn.primary:hover { background:#18684C; }
    .section-title { display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); padding:0 0 10px; margin:0 0 17px; }
    h2 { margin:0; color:var(--muted); font-size:11px; letter-spacing:.8px; font-weight:700; }
    .section-note { color:#9AA0A6; font-size:11px; }
    .meta { display:grid; grid-template-columns:minmax(190px,1fr) minmax(230px,1.6fr) minmax(180px,.8fr); gap:22px; margin-bottom:30px; }
    .field { display:flex; flex-direction:column; gap:7px; min-width:0; }
    .field>span { color:#656D74; font-size:12px; }
    .required { color:var(--green); margin-left:3px; }
    input,select { width:100%; min-width:0; height:36px; padding:0 10px; background:#fff; border:1px solid #DFE3E6; color:var(--ink); border-radius:6px; outline:none; transition:border-color .15s,box-shadow .15s; }
    input:hover,select:hover { border-color:#A9BDB2; }
    input:focus,select:focus { border-color:var(--green); box-shadow:0 0 0 3px #1E7A5A12; }
    input::placeholder { color:#AFB5BB; }
    input[type=number] { font-variant-numeric:tabular-nums; }
    .details-title { margin-bottom:12px; }
    .details-label { display:flex; align-items:center; gap:9px; }
    .count { font-size:10px; font-weight:600; color:#6F787F; background:#F0F2F3; border-radius:4px; padding:1px 6px; }
    .table-wrap { border:1px solid var(--line); border-radius:9px; overflow:hidden; }
    .table-head,.line-main { display:grid; grid-template-columns:72px minmax(190px,2fr) minmax(84px,.7fr) 68px minmax(80px,.65fr) 66px minmax(115px,1fr) 42px; gap:12px; align-items:center; }
    .table-head { padding:11px 16px; background:#F8F9FA; border-bottom:1px solid var(--line); color:var(--muted); font-size:11px; }
    .table-head span:last-child { text-align:center; }
    .item { padding:17px 16px 14px; border-bottom:1px solid var(--line); transition:background .4s; }
    .item:last-child { border-bottom:0; }
    .item.fresh { animation:highlight 2s ease-out; }
    @keyframes highlight { 0%,30% { background:#E6F2EC; } 100% { background:#fff; } }
    .copy-cell { display:flex; align-items:center; gap:8px; }
    .number { font-size:11px; color:#ABB1B6; font-variant-numeric:tabular-nums; }
    .copy { display:flex; align-items:center; gap:3px; border:0; background:transparent; color:var(--green); font-size:12px; padding:5px 0; }
    .copy svg { width:13px; height:13px; }
    .copy:hover { color:#104E37; text-decoration:underline; }
    .delete { display:grid; place-items:center; color:#A0A7AD; border:0; background:transparent; width:34px; height:34px; border-radius:6px; }
    .delete:hover { background:#FFF0F0; color:var(--danger); }
    .line-extra { margin:10px 0 0 84px; display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
    .color-label { font-size:11px; color:var(--muted); }
    .colors { display:flex; flex-wrap:wrap; gap:5px; }
    .color { font-size:10px; font-weight:600; padding:3px 8px; line-height:1.4; border-radius:4px; border:1px solid #E3E5E7; color:#747C83; background:#fff; min-width:28px; }
    .color.selected { border-color:#CDB77B; background:#FAF3DF; color:#947226; }
    .color[data-color=S].selected { background:#EAEFF4; color:#617285; border-color:#BAC7D4; }
    .color[data-color=RG].selected { background:#FAEAE4; color:#AF725E; border-color:#DDB4A6; }
    .color.more { border-style:dashed; font-weight:400; }
    .target { color:#8C949A; font-size:11px; margin-left:3px; }
    .target strong { font-weight:400; color:#57675E; }
    .target code { color:#9DA5AA; margin-left:4px; font-size:10px; }
    .add-line { display:flex; align-items:center; justify-content:center; gap:7px; width:100%; margin-top:11px; padding:11px; border:1px dashed #D7DFDA; color:var(--green); border-radius:7px; background:#FCFDFC; }
    .add-line:hover { background:#F1F8F4; border-color:#7EAF97; }
    .hint { display:flex; align-items:center; gap:6px; color:#9AA1A7; font-size:11px; margin:12px 0 24px; }
    .hint svg { width:13px; height:13px; }
    .empty { color:var(--muted); text-align:center; padding:35px; }
    .footer { position:sticky; bottom:0; margin-top:auto; padding:18px 0; border-top:1px solid var(--line); background:#FFFFFFF5; backdrop-filter:blur(12px); display:flex; align-items:center; justify-content:space-between; gap:16px; z-index:2; }
    .footer-summary { display:flex; align-items:center; gap:16px; font-size:12px; color:var(--muted); }
    .footer-summary strong { font-weight:650; font-size:15px; color:var(--ink); margin:0 3px; font-variant-numeric:tabular-nums; }
    .footer-summary .divider { height:14px; width:1px; background:var(--line); }
    .footer-actions { display:flex; align-items:center; gap:10px; }
    .preview-notice { margin:6px 0 25px; color:#99A29D; font-size:11px; display:flex; align-items:center; gap:6px; }
    .preview-dot { width:5px; height:5px; border-radius:50%; background:#78A68D; }
    .toast { position:fixed; top:22px; left:50%; transform:translate(-50%,-15px); background:#183B2E; color:#fff; padding:11px 18px; border-radius:8px; box-shadow:0 7px 25px #183B2E26; opacity:0; transition:.2s; pointer-events:none; z-index:5; font-size:12px; max-width:90vw; }
    .toast.visible { opacity:1; transform:translate(-50%,0); }
    .mobile-label { display:none; }
    @media(min-width:1600px) { .table-head,.line-main { grid-template-columns:80px minmax(240px,2fr) minmax(110px,.7fr) 90px minmax(110px,.65fr) 80px minmax(180px,1fr) 48px; gap:18px; } .line-extra { margin-left:98px; } }
    @media(max-width:1180px) and (min-width:761px) { .sidebar { width:64px; padding:25px 8px; } .brand { padding:0 8px 20px; } .brand-name,.nav-group,.nav-item span,.user { display:none; } .nav-item { justify-content:center; padding:12px 0; } .nav-item.child { display:none; } main { margin-left:64px; padding:26px 24px 0; } }
    @media(max-width:1000px) and (min-width:761px) { .table-head,.line-main { grid-template-columns:65px minmax(150px,2fr) 74px 56px 70px 56px minmax(90px,1fr) 30px; gap:8px; } .table-head,.item { padding-left:12px; padding-right:12px; } .line-extra { margin-left:73px; } }
    @media(max-width:760px) { .sidebar { display:none; } main { margin-left:0; padding:20px 16px 0; } h1 { font-size:22px; } .head>.btn { font-size:12px; padding:6px 9px; } .crumbs { margin-bottom:15px; } .intro { font-size:11px; margin-bottom:24px; } .meta { grid-template-columns:1fr 1fr; gap:15px 12px; margin-bottom:25px; } .field.note { grid-column:1/-1; grid-row:2; } .section-note { display:none; } .table-head { display:none; } .line-main { grid-template-columns:1fr 1fr; gap:11px; } .copy-cell { grid-column:1; } .delete { grid-column:2; grid-row:1; justify-self:end; width:30px; height:28px; } .part-field { grid-column:1/-1; } .row-note { grid-column:1/-1; } .mobile-label { display:block; color:var(--muted); font-size:10px; margin-bottom:5px; } .line-extra { margin:14px 0 0; gap:8px; } .target { flex-basis:100%; margin:1px 0 0; } .item { padding:10px 13px 16px; } .footer { padding:13px 0; flex-wrap:wrap; gap:10px; } .footer-summary { font-size:11px; gap:10px; } .footer-summary strong { font-size:13px; } .footer-actions { margin-left:auto; } .footer-actions .btn { padding:8px 13px; } .hint { align-items:flex-start; } .hint svg { margin-top:2px; } .preview-notice { font-size:10px; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
  </style>
</head>
<body>
  <svg style="display:none" aria-hidden="true"><defs>
    <symbol id="copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></symbol>
    <symbol id="back" viewBox="0 0 24 24"><path d="m10 5-7 7 7 7M3 12h18"/></symbol>
    <symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="part" viewBox="0 0 24 24"><path d="m12 3 9 5v9l-9 5-9-5V8l9-5Zm0 9 9-4M12 12 3 8m9 4v10"/></symbol>
    <symbol id="send" viewBox="0 0 24 24"><path d="m3 10 18-7-7 18-3-8-8-3Zm8 3L21 3"/></symbol>
    <symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  </defs></svg>
  <aside class="sidebar" aria-label="示意导航">
    <div class="brand"><span class="brand-mark">AL</span><span class="brand-name">ALLENOP</span></div>
    <div class="nav-group">工作台</div><div class="nav-item"><svg><use href="#grid"/></svg><span>进度看板</span></div>
    <div class="nav-group">商品</div><div class="nav-item"><svg><use href="#part"/></svg><span>配件管理</span></div><div class="nav-item"><svg><use href="#part"/></svg><span>饰品管理</span></div>
    <div class="nav-group">生产</div><div class="nav-item"><svg><use href="#part"/></svg><span>订单管理</span></div><div class="nav-item"><svg><use href="#part"/></svg><span>配件采购</span></div><div class="nav-item"><svg><use href="#grid"/></svg><span>电镀</span></div><div class="nav-item child">电镀汇总</div><div class="nav-item child active">电镀发出</div><div class="nav-item child">电镀回收</div><div class="nav-item"><svg><use href="#send"/></svg><span>手工单</span></div>
    <div class="nav-group">库存</div><div class="nav-item"><svg><use href="#part"/></svg><span>库存总表</span></div>
    <div class="user"><span class="avatar">A</span><span>样式预览 · 示例数据</span></div>
  </aside>
  <main>
    <div class="crumbs"><span>生产</span><span>/</span><span>电镀发出</span><span>/</span><span>新建</span></div>
    <header class="head"><div class="title"><h1>新建电镀单</h1><span class="badge">录入中</span></div><button class="btn" data-demo-back><svg><use href="#back"/></svg>返回列表</button></header>
    <p class="intro">填写电镀信息，添加本次发出的配件与电镀颜色。</p>
    <section aria-labelledby="basic-title">
      <div class="section-title"><h2 id="basic-title">基本信息</h2><span class="section-note">创建后为待发出状态，可继续编辑</span></div>
      <div class="meta">
        <label class="field"><span>电镀厂名称<b class="required">*</b></span><input list="suppliers" value="义乌 · 恒丰电镀厂" placeholder="选择或输入电镀厂名称"><datalist id="suppliers"><option value="义乌 · 恒丰电镀厂"><option value="东阳 · 鑫源电镀厂"></datalist></label>
        <label class="field note"><span>备注</span><input placeholder="填写本次电镀要求、交期等（选填）" value="按样板色电镀，同款配件分色处理"></label>
        <label class="field"><span>创建时间</span><input type="date" aria-label="创建时间" value="2026-11-08"></label>
      </div>
    </section>
    <section aria-labelledby="detail-title">
      <div class="section-title details-title"><div class="details-label"><h2 id="detail-title">电镀明细</h2><span class="count" id="row-count">3 项</span></div><button class="btn green" data-add><svg><use href="#plus"/></svg>添加明细</button></div>
      <div class="table-wrap">
        <div class="table-head" aria-hidden="true"><span>行操作</span><span>发出配件</span><span>发出数量</span><span>单位</span><span>重量</span><span>重量单位</span><span>明细备注</span><span>删除</span></div>
        <div id="rows"></div>
      </div>
      <button class="add-line" data-add><svg><use href="#plus"/></svg>添加一行电镀明细</button>
      <p class="hint"><svg><use href="#info"/></svg>同款不同色？点击行首「复制」，再修改电镀颜色即可，无需重复填写。</p>
    </section>
    <div class="preview-notice"><span class="preview-dot"></span>交互原型 · 使用示例数据，所有操作仅在当前页面演示，不会保存或发出电镀单。</div>
    <footer class="footer">
      <div class="footer-summary"><span>共<strong id="total-rows">3</strong>项明细</span><span class="divider"></span><span id="quantity-summary"></span><span class="divider"></span><span>总重量<strong id="total-weight"></strong>kg</span></div>
      <div class="footer-actions"><button class="btn" data-demo-back>取消</button><button class="btn primary" id="submit"><svg><use href="#check"/></svg>创建电镀单</button></div>
    </footer>
  </main>
  <div class="toast" role="status" aria-live="polite" id="toast"></div>
  <script>
    // Standalone mockup only: no API calls, storage, or production writes.
    const parts = [
      { id:'PJ-DZ-00033', name:'合金蝴蝶吊坠', unit:'个' },
      { id:'PJ-LT-00008', name:'细蛇骨链 · 45cm', unit:'条' },
      { id:'PJ-X-00102', name:'龙虾扣 · 12mm', unit:'个' },
    ];
    const colors = [{code:'G',name:'金色'},{code:'S',name:'银色'},{code:'RG',name:'玫瑰金'},{code:'WG',name:'白金色'},{code:'AG',name:'古金色'}];
    const units = ['个','条','米','g','kg'];
    let nextId = 4;
    const items = [
      { id:1, part:parts[0].id, qty:300, unit:'个', weight:0.45, weightUnit:'kg', note:'按样板金色', color:'G', more:false },
      { id:2, part:parts[1].id, qty:200, unit:'条', weight:0.8, weightUnit:'kg', note:'链条勿打结', color:'S', more:false },
      { id:3, part:parts[2].id, qty:500, unit:'个', weight:0.32, weightUnit:'kg', note:'', color:'RG', more:false },
    ];
    const rows = document.getElementById('rows');
    const icon = name => `<svg aria-hidden="true"><use href="#${name}"/></svg>`;
    const escape = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const options = (values, selected) => values.map(v => `<option${v === selected ? ' selected' : ''}>${escape(v)}</option>`).join('');
    function target(item) {
      if (!item.part || !item.color) return '<span class="target">选择配件及颜色后，显示对应配件</span>';
      const part = parts.find(p => p.id === item.part);
      const color = colors.find(c => c.code === item.color);
      return `<span class="target">对应配件：<strong>${escape(part.name)}_${color.name}</strong><code>${escape(part.id)}-${color.code}</code></span>`;
    }
    function render(freshId) {
      rows.innerHTML = items.length ? items.map((item,index) => `<article class="item${item.id === freshId ? ' fresh' : ''}" data-id="${item.id}" aria-label="第 ${index+1} 行电镀明细">
        <div class="line-main">
          <div class="copy-cell"><span class="number">${String(index+1).padStart(2,'0')}</span><button class="copy" data-action="copy" aria-label="复制第 ${index+1} 行">${icon('copy')}复制</button></div>
          <label class="part-field"><span class="mobile-label">发出配件</span><select data-field="part" aria-label="第 ${index+1} 行发出配件"><option value="">选择发出配件</option>${parts.map(p => `<option value="${p.id}"${p.id === item.part ? ' selected' : ''}>${p.name} · ${p.id}</option>`).join('')}</select></label>
          <label><span class="mobile-label">发出数量</span><input type="number" min="1" step="1" value="${item.qty}" data-field="qty" aria-label="第 ${index+1} 行发出数量"></label>
          <label><span class="mobile-label">单位</span><select data-field="unit" aria-label="第 ${index+1} 行单位">${options(units,item.unit)}</select></label>
          <label><span class="mobile-label">重量</span><input type="number" min="0" step="0.0001" placeholder="选填" value="${item.weight ?? ''}" data-field="weight" aria-label="第 ${index+1} 行重量"></label>
          <label><span class="mobile-label">重量单位</span><select data-field="weightUnit" aria-label="第 ${index+1} 行重量单位">${options(['kg','g'],item.weightUnit)}</select></label>
          <label class="row-note"><span class="mobile-label">明细备注</span><input placeholder="备注（选填）" value="${escape(item.note)}" data-field="note" aria-label="第 ${index+1} 行备注"></label>
          <button class="delete" data-action="delete" aria-label="删除第 ${index+1} 行" title="删除当前行">${icon('trash')}</button>
        </div>
        <div class="line-extra"><span class="color-label">电镀颜色</span><div class="colors">${colors.slice(0,item.more ? colors.length : 3).map(c => `<button class="color${c.code === item.color ? ' selected' : ''}" data-color="${c.code}" aria-pressed="${c.code === item.color}" title="${c.name}">${c.code}</button>`).join('')}<button class="color more" data-action="more">${item.more ? '收起 ▴' : '更多 ▾'}</button></div>${target(item)}</div>
      </article>`).join('') : '<div class="empty">暂无明细，点击下方按钮添加发出配件。</div>';
      updateSummary();
    }
    function updateSummary() {
      document.getElementById('row-count').textContent = `${items.length} 项`;
      document.getElementById('total-rows').textContent = items.length;
      const quantities = new Map();
      for (const item of items) quantities.set(item.unit,(quantities.get(item.unit) || 0) + Number(item.qty || 0));
      document.getElementById('quantity-summary').innerHTML = `发出 ${[...quantities].map(([unit,qty]) => `<strong>${qty.toLocaleString('zh-CN')}</strong>${escape(unit)}`).join(' / ') || '—'}`;
      const total = items.reduce((sum,item) => sum + Number(item.weight || 0) / (item.weightUnit === 'g' ? 1000 : 1),0);
      document.getElementById('total-weight').textContent = Number(total.toFixed(4)).toLocaleString('zh-CN');
    }
    let toastTimer;
    function toast(message) {
      const box = document.getElementById('toast');
      box.textContent = message;
      box.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => box.classList.remove('visible'),2600);
    }
    function focusRow(id) {
      const row = rows.querySelector(`[data-id="${id}"]`);
      row.scrollIntoView({ behavior:matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth', block:'nearest' });
      row.querySelector('select').focus({preventScroll:true});
    }
    rows.addEventListener('click',event => {
      const button = event.target.closest('button');
      if (!button) return;
      const index = items.findIndex(item => item.id === Number(button.closest('[data-id]').dataset.id));
      const item = items[index];
      if (button.dataset.action === 'copy') {
        const clone = { ...item, id:nextId++ };
        items.splice(index+1,0,clone);
        render(clone.id); focusRow(clone.id);
        toast(`已复制第 ${index+1} 行，新行已插入下方，可独立修改`);
      } else if (button.dataset.action === 'delete') {
        items.splice(index,1); render(); toast('已删除当前明细行');
      } else if (button.dataset.action === 'more') {
        item.more = !item.more; render();
      } else if (button.dataset.color) {
        item.color = item.color === button.dataset.color ? null : button.dataset.color;
        render();
      }
    });
    rows.addEventListener('input',event => {
      const field = event.target.dataset.field;
      if (!field) return;
      const item = items.find(item => item.id === Number(event.target.closest('[data-id]').dataset.id));
      item[field] = ['qty','weight'].includes(field) ? (event.target.value === '' ? null : Number(event.target.value)) : event.target.value;
      if (field === 'part') {
        item.unit = parts.find(p => p.id === item.part)?.unit || '个';
        render();
      } else updateSummary();
    });
    document.querySelectorAll('[data-add]').forEach(button => button.addEventListener('click',() => {
      const item = { id:nextId++, part:'', qty:1, unit:'个', weight:null, weightUnit:'kg', note:'', color:'G', more:false };
      items.push(item); render(item.id); focusRow(item.id);
    }));
    document.getElementById('submit').addEventListener('click',() => toast('这是样式预览，不会创建真实电镀单'));
    document.querySelectorAll('[data-demo-back]').forEach(button => button.addEventListener('click',() => toast('当前为独立预览，未离开页面或丢弃内容')));
    render();
  </script>
</body>
</html>
